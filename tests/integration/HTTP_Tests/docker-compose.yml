version: '3.8'

services:
  mock-http-server:
    build:
      context: ./mockServer
      dockerfile: Dockerfile
    container_name: stock-analysis-mock-http
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - test-network

networks:
  test-network:
    driver: bridge