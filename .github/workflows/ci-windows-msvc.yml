name: CI – Windows MSVC Release

on:
  pull_request:
    branches: [ main, ci_test ]

jobs:
  build-release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      # Выкачиваем код
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # важно для правильного merge-base в PR

      # Кэш conan
      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~\.conan2
          key: conan2-windows-msvc-${{ hashFiles('conanfile.txt', 'extern/**') }}-v8
          restore-keys: |
            conan2-windows-msvc-

      # Установка LLVM
      - name: Install clang-format
        if: github.event_name == 'pull_request'   # только в PR
        run: |
          choco install llvm --version=19.1.7 -y --force --no-progress
          refreshenv   # обновляем PATH
          clang-format --version

      # Ставим Python
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Устанавливаем Conan через pip
      - name: Install Conan 2.x
        run: |
          python -m pip install --upgrade pip
          pip install conan
          conan --version

      # Установка профилей conan
      - name: Deploy conan profiles
        run: |
          cd extern
          python ./conan_install.py

      # Сборка extern библиотек
      - name: Install dependencies
        run: |
          cd extern
          python ./conan_msvc_script.py   

      # Сборка проекта
      - name: Configure CMake
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release -B cmake-build-release-visual-studio
          

      - name: Build project
        run: |
          cmake --build .\cmake-build-release-visual-studio\

      # Автотесты
      - name: Unit tests
        run: |
          ctest --test-dir .\cmake-build-release-visual-studio\tests